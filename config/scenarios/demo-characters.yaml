name: demo-characters
description: >
  Each demo line tells one story. Welding: the robot welder (stage 3) breaks
  down often and takes long to repair, a breakdown bottleneck. Window: the
  glazing stage (3) is slower than planned and has a tiny buffer in front, so
  stage 2 waits for space most of the time, a flow bottleneck. (Fabrication
  "faster than plan" is on the ERP side: its routing times are too long.)

lines:
  automotive-welding:
    stages:
      3:
        breakdown_factor: 1.5        # 0.03 -> 0.045 per cycle (~every 5.5 min at 15 s)
        auto_restore_time_ms: 150000 # 2.5 min per repair instead of 1 min
        note: "robot welder: frequent breakdowns, long repairs"
  window-frame:
    stages:
      3:
        cycle_time_factor: 1.3       # 22 s -> 29 s (standard), 30 s -> 39 s (large)
        note: "glazing slower than the routing says"
    buffers:
      - {from_stage: 2, to_stage: 3, capacity: 2}
