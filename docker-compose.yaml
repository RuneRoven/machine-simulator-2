services:
  simulator:
    build: .
    ports:
      - "8081:8081"
      - "4840-4880:4840-4880"
      # Line job servers (orders.source: external)
      - "4900-4909:4900-4909"
      - "502:502"
    environment:
      # Option 1: Per-line env vars (takes priority if any are set > 0)
      SIMULATOR_LINE_AUTOMOTIVE_WELDING: ${SIMULATOR_LINE_AUTOMOTIVE_WELDING:-0}
      SIMULATOR_LINE_AUTOMOTIVE_ASSEMBLY: ${SIMULATOR_LINE_AUTOMOTIVE_ASSEMBLY:-0}
      SIMULATOR_LINE_ELECTRONICS_SMT: ${SIMULATOR_LINE_ELECTRONICS_SMT:-0}
      SIMULATOR_LINE_ELECTRONICS_THROUGH_HOLE: ${SIMULATOR_LINE_ELECTRONICS_THROUGH_HOLE:-0}
      SIMULATOR_LINE_FOOD_BEVERAGE_FILLING: ${SIMULATOR_LINE_FOOD_BEVERAGE_FILLING:-0}
      SIMULATOR_LINE_PHARMA_BATCH: ${SIMULATOR_LINE_PHARMA_BATCH:-0}
      SIMULATOR_LINE_WINDOW_FRAME: ${SIMULATOR_LINE_WINDOW_FRAME:-0}
      SIMULATOR_LINE_FURNITURE_ASSEMBLY: ${SIMULATOR_LINE_FURNITURE_ASSEMBLY:-0}
      SIMULATOR_LINE_METAL_PARTS_FABRICATION: ${SIMULATOR_LINE_METAL_PARTS_FABRICATION:-0}
      SIMULATOR_LINE_PLASTIC_PARTS_MOLDING: ${SIMULATOR_LINE_PLASTIC_PARTS_MOLDING:-0}
      # internal: built-in ERP/MES; external: an outside MES loads line jobs
      SIMULATOR_ORDERS_SOURCE: ${SIMULATOR_ORDERS_SOURCE:-internal}
      # OPC-UA hostname override for Docker networking
      SIMULATOR_OPCUA_HOSTNAME: simulator
      # Option 2: Profile-based (fallback if no SIMULATOR_LINE_* vars > 0)
      SIMULATOR_PROFILE: ${SIMULATOR_PROFILE:-demo-mixed}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
